# Environment for the LAML multi-omics project.
#   conda env create -f environment.yml
#   conda activate laml
# Versions are those of the working environment (Python 3.11, Windows).
name: laml
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - anndata==0.12.19
      - lifelines==0.30.3
      - matplotlib==3.11.2
      - mofapy2==0.7.5
      - mofax==0.3.7
      - mudata==0.3.10
      - muon==0.1.9
      - numpy==1.26.4
      - pandas==2.3.3
      - scanpy==1.11.5
      - scikit-learn==1.9.1
      - scipy==1.17.1
      - ipykernel==7.4.0
